<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeBoost - Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@300;400;500;600&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9749;</text></svg>">
  <style>
    .profile-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      min-height: calc(100vh - 180px);
    }

    .profile-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      font-size: 0.9rem;
      color: var(--cream-faint);
    }

    .profile-loading .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--copper);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 2rem;
      animation: card-in 0.5s var(--ease-out) both;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-lg);
      border: 3px solid var(--copper);
      box-shadow: 0 0 24px var(--copper-muted);
      object-fit: cover;
      background: var(--bg-elevated);
    }

    .profile-avatar-placeholder {
      width: 120px;
      height: 120px;
      border-radius: var(--radius-lg);
      border: 3px solid var(--copper);
      background: var(--copper-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--copper-light);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      color: var(--cream);
      letter-spacing: -0.03em;
      margin-bottom: 0.25rem;
    }

    .profile-realname {
      font-size: 0.9rem;
      color: var(--cream-muted);
      margin-bottom: 0.5rem;
    }

    .profile-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-xl);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .profile-badge--online {
      background: var(--green-muted);
      color: var(--green);
    }

    .profile-badge--offline {
      background: var(--red-muted);
      color: var(--red);
    }

    .profile-badge--country {
      background: var(--copper-muted);
      color: var(--copper-light);
    }

    .profile-steam-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: var(--copper-light);
      transition: color 0.2s;
    }

    .profile-steam-link:hover { color: var(--cream); }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
      animation: card-in 0.5s var(--ease-out) 0.1s both;
    }

    .profile-stat-card {
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      transition: all 0.3s var(--ease-out);
    }

    .profile-stat-card:hover {
      border-color: var(--border);
      background: var(--bg-elevated);
      transform: translateY(-2px);
    }

    .profile-stat-label {
      font-size: 0.68rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--cream-faint);
      margin-bottom: 0.35rem;
    }

    .profile-stat-value {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--cream);
      letter-spacing: -0.02em;
    }

    .profile-stat-value small {
      font-size: 0.75rem;
      color: var(--cream-muted);
      font-weight: 400;
    }

    .profile-section {
      background: var(--bg-raised);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      animation: card-in 0.5s var(--ease-out) 0.2s both;
    }

    .profile-section-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--cream);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .profile-section-title svg {
      width: 18px;
      height: 18px;
      color: var(--copper);
    }

    .profile-detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .profile-detail-row:last-child { border-bottom: none; }

    .profile-detail-label {
      font-size: 0.82rem;
      color: var(--cream-faint);
    }

    .profile-detail-value {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--cream);
    }

    .profile-actions {
      display: flex;
      gap: 0.75rem;
      animation: card-in 0.5s var(--ease-out) 0.3s both;
    }

    @media (max-width: 600px) {
      .profile-header { flex-direction: column; text-align: center; }
      .profile-badges { justify-content: center; }
      .profile-name { font-size: 1.5rem; }
      .profile-avatar, .profile-avatar-placeholder { width: 96px; height: 96px; }
      .profile-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="grain-overlay" aria-hidden="true"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 4C12 4 8 10 8 16C8 20 10 24 14 26L12 36H28L26 26C30 24 32 20 32 16C32 10 28 4 20 4Z" fill="var(--copper)" opacity="0.9"/>
          <path d="M32 14C34 14 36 16 36 18C36 20 34 22 32 22" stroke="var(--copper-light)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M15 12C15 12 17 14 20 14C23 14 25 12 25 12" stroke="var(--cream)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <circle cx="16" cy="8" r="1" fill="var(--cream)" opacity="0.4"/>
          <circle cx="20" cy="6" r="1.2" fill="var(--cream)" opacity="0.3"/>
          <circle cx="24" cy="8" r="1" fill="var(--cream)" opacity="0.4"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">CoffeeBoost</span>
        <span class="brand-tag">Steam Idler</span>
      </div>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/profile.html" class="nav-link" style="color: var(--cream);">Profile</a>
      <a href="#" class="nav-link">Steam Group</a>
      <a href="#" class="nav-link">Bug Report</a>
    </div>
    <div class="nav-actions">
      <div class="nav-user" id="nav-user-area">
        <div class="user-avatar" id="nav-avatar">?</div>
        <span class="user-name" id="nav-username">Loading...</span>
      </div>
      <a href="/api/auth/logout" class="btn-idle-view" style="text-decoration:none;">Sign Out</a>
    </div>
    <button class="nav-mobile-toggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Profile content -->
  <div class="profile-page" id="profile-content">
    <div class="profile-loading" id="profile-loading">
      <div class="spinner"></div>
      Loading your profile...
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-brand">CoffeeBoost v3.0</span>
      <span class="footer-sep">&middot;</span>
      <span>Steam Game Idler</span>
      <span class="footer-sep">&middot;</span>
      <a href="#" class="footer-link">GitHub</a>
      <span class="footer-sep">&middot;</span>
      <a href="#" class="footer-link">Documentation</a>
    </div>
  </footer>

  <script>
    (function () {
      'use strict';

      var container = document.getElementById('profile-content');
      var loading = document.getElementById('profile-loading');

      fetch('/api/auth/me')
        .then(function (res) {
          if (!res.ok) {
            window.location.href = '/login.html';
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          if (!data) return;

          var p = data.profile;

          // Update nav
          document.getElementById('nav-username').textContent = p.personaname;
          if (p.avatarmedium) {
            document.getElementById('nav-avatar').innerHTML = '<img src="' + p.avatarmedium + '" style="width:30px;height:30px;border-radius:50%;" alt="">';
          } else {
            document.getElementById('nav-avatar').textContent = p.personaname.substring(0, 2).toUpperCase();
          }

          var stateLabels = ['Offline', 'Online', 'Busy', 'Away', 'Snooze', 'Looking to Trade', 'Looking to Play'];
          var stateLabel = stateLabels[p.personastate] || 'Offline';
          var isOnline = p.personastate > 0;

          var memberSince = p.timecreated ? new Date(p.timecreated * 1000).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Unknown';
          var accountAge = p.timecreated ? Math.floor((Date.now() / 1000 - p.timecreated) / (365.25 * 24 * 60 * 60)) : '?';

          loading.style.display = 'none';

          container.innerHTML = ''
            + '<div class="profile-header">'
            +   (p.avatarfull
                  ? '<img class="profile-avatar" src="' + p.avatarfull + '" alt="' + p.personaname + '">'
                  : '<div class="profile-avatar-placeholder">' + p.personaname.substring(0, 2).toUpperCase() + '</div>')
            +   '<div class="profile-info">'
            +     '<h1 class="profile-name">' + p.personaname + '</h1>'
            +     (p.realname ? '<div class="profile-realname">' + p.realname + '</div>' : '')
            +     '<div class="profile-badges">'
            +       '<span class="profile-badge ' + (isOnline ? 'profile-badge--online' : 'profile-badge--offline') + '">'
            +         '<span class="status-dot ' + (isOnline ? 'status-dot--active' : 'status-dot--inactive') + '" style="width:6px;height:6px;"></span>'
            +         stateLabel
            +       '</span>'
            +       (p.loccountrycode ? '<span class="profile-badge profile-badge--country">' + p.loccountrycode + '</span>' : '')
            +     '</div>'
            +     (p.profileurl ? '<a href="' + p.profileurl + '" target="_blank" rel="noopener" class="profile-steam-link">'
            +       '<svg viewBox="0 0 16 16" fill="none" width="14" height="14"><path d="M6 3H3v10h10v-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 1h7v7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 1L7 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
            +       'View Steam Profile</a>' : '')
            +   '</div>'
            + '</div>'

            + '<div class="profile-stats">'
            +   '<div class="profile-stat-card">'
            +     '<div class="profile-stat-label">Steam ID</div>'
            +     '<div class="profile-stat-value" style="font-size:1rem;">' + p.steamId + '</div>'
            +   '</div>'
            +   '<div class="profile-stat-card">'
            +     '<div class="profile-stat-label">Member Since</div>'
            +     '<div class="profile-stat-value" style="font-size:1rem;">' + memberSince + '</div>'
            +   '</div>'
            +   '<div class="profile-stat-card">'
            +     '<div class="profile-stat-label">Account Age</div>'
            +     '<div class="profile-stat-value">' + accountAge + ' <small>years</small></div>'
            +   '</div>'
            +   '<div class="profile-stat-card">'
            +     '<div class="profile-stat-label">Current Status</div>'
            +     '<div class="profile-stat-value" style="font-size:1rem;">' + stateLabel + '</div>'
            +   '</div>'
            + '</div>'

            + '<div class="profile-section">'
            +   '<h2 class="profile-section-title">'
            +     '<svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 5v4l2.5 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>'
            +     'Account Details'
            +   '</h2>'
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Steam Display Name</span>'
            +     '<span class="profile-detail-value">' + p.personaname + '</span>'
            +   '</div>'
            +   (p.realname ? '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Real Name</span>'
            +     '<span class="profile-detail-value">' + p.realname + '</span>'
            +   '</div>' : '')
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Steam ID 64</span>'
            +     '<span class="profile-detail-value">' + p.steamId + '</span>'
            +   '</div>'
            +   (p.loccountrycode ? '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Country</span>'
            +     '<span class="profile-detail-value">' + p.loccountrycode + '</span>'
            +   '</div>' : '')
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Persona State</span>'
            +     '<span class="profile-detail-value">' + stateLabel + '</span>'
            +   '</div>'
            + '</div>'

            + '<div class="profile-section">'
            +   '<h2 class="profile-section-title">'
            +     '<svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M6 9l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            +     'CoffeeBoost Settings'
            +   '</h2>'
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Package</span>'
            +     '<span class="profile-detail-value">Pro Roast</span>'
            +   '</div>'
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Max Accounts</span>'
            +     '<span class="profile-detail-value">10</span>'
            +   '</div>'
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Max Games / Account</span>'
            +     '<span class="profile-detail-value">32</span>'
            +   '</div>'
            +   '<div class="profile-detail-row">'
            +     '<span class="profile-detail-label">Auto-Restart</span>'
            +     '<span class="profile-detail-value" style="color: var(--green);">Enabled</span>'
            +   '</div>'
            + '</div>'

            + '<div class="profile-actions">'
            +   '<a href="/" class="btn-primary" style="text-decoration:none;">'
            +     '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
            +     'Go to Dashboard'
            +   '</a>'
            +   '<a href="/api/auth/logout" class="btn-secondary" style="text-decoration:none;">'
            +     'Sign Out'
            +   '</a>'
            + '</div>';
        })
        .catch(function () {
          window.location.href = '/login.html';
        });
    })();
  </script>
</body>
</html>
